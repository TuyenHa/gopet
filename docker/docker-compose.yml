# Môi trường database cục bộ cho GServer.
#
# === TẠI SAO 10.4 CHỨ KHÔNG PHẢI BẢN MỚI HƠN ===
#
# Dump gốc sinh từ MariaDB 10.4.32, và code game PHỤ THUỘC vào hành vi của 10.4.
# Đã kiểm chứng bằng thực nghiệm: TopPet.cs:30 dùng
#
#     JSON_VALUE(player.pets, '$[*].exp')
#
# 10.4  -> chấp nhận, trả về phần tử khớp đầu tiên
# 10.11 -> ERROR 4044 "Wildcards or range in JSON path not allowed"
#
# Thử 10.11 trước và gặp đúng lỗi này lúc chạy thật. Đổi query để hợp 10.11
# sẽ làm đổi hành vi game (bảng xếp hạng pet), nằm ngoài phạm vi đã thống nhất
# là "chỉ vá bảo mật, giữ nguyên hành vi". Và gần như chắc chắn còn chỗ khác
# tương tự chưa lộ ra — khớp version là cách duy nhất tránh phát hiện lẻ tẻ.
#
# ĐÁNH ĐỔI: 10.4 đã hết vòng đời hỗ trợ (6/2024), không còn bản vá bảo mật.
# Chấp nhận được ở đây vì container chỉ bind vào loopback và chứa dữ liệu test.
# KHÔNG dùng cấu hình này cho production mà không xem lại.
#
#   docker compose up -d
#   docker compose logs -f mariadb      # theo dõi lúc nạp dump lần đầu
#   docker compose down -v              # xoá sạch để nạp lại từ đầu

services:
  mariadb:
    image: mariadb:10.4
    container_name: gopet-mariadb
    restart: unless-stopped

    environment:
      # 10.4 dùng tiền tố MYSQL_; các bản mới hơn dùng MARIADB_. Đặt cả hai
      # để đổi image không phải sửa lại chỗ này.
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Thiếu MARIADB_ROOT_PASSWORD - sao chép .env.example thành .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      # Đồng bộ giờ VN với gserver/webadmin (mục "Múi giờ" docs/deployment-linux-backend.md).
      # Chỉ đổi NOW()/CURRENT_TIMESTAMP() của MariaDB (cột timestamp thật, và cột datetime
      # dùng DEFAULT current_timestamp() khi app không truyền giá trị) — cột datetime đã lưu
      # sẵn KHÔNG bị viết lại, chỉ có khác biệt một lần giữa dữ liệu cũ (giờ UTC) và mới (giờ VN).
      TZ: Asia/Ho_Chi_Minh

    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --max-allowed-packet=64M
      --innodb-buffer-pool-size=512M
      --default-time-zone=+07:00

    ports:
      # CHỈ bind vào loopback. Không để 0.0.0.0 — database này chứa dữ liệu
      # người dùng thật lấy từ dump và không nên nghe trên mạng.
      - "127.0.0.1:3306:3306"

    volumes:
      # Dump gốc, chỉ đọc. Không sao chép vào repo để tránh trùng lặp 1.6 MB.
      - ../SRCGOPETGOC/MariaDB_SQL:/dumps:ro
      # Script nạp, chạy đúng một lần khi volume dữ liệu còn rỗng.
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - gopet-db-data:/var/lib/mysql

    healthcheck:
      # 10.4 chưa có healthcheck.sh của các image mới.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
      # Nạp dump lần đầu khá lâu; đừng báo unhealthy trong lúc đó.
      start_period: 180s

  # Máy chủ game. Nằm sau profile "server" để `docker compose up -d` trên máy dev
  # vẫn chỉ bật database như trước (dev chạy Gopet.exe native).
  #
  # Máy chủ KHÔNG build: GitHub Actions (job build-push) đẩy image lên GHCR, máy chủ
  # pull qua docker/deploy-service.sh gserver. `build:` chỉ để máy dev thử container:
  #   docker compose --profile server build gserver
  #
  # Hướng dẫn đầy đủ: docs/deployment-linux-backend.md
  gserver:
    profiles: ["server"]
    build:
      context: ../SRCGOPETGOC/GServer
    image: ghcr.io/${GHCR_OWNER:-unset}/gopet-gserver:${GSERVER_TAG:-latest}
    container_name: gopet-gserver
    restart: unless-stopped

    depends_on:
      mariadb:
        condition: service_healthy

    environment:
      # Nối DB qua mạng nội bộ của compose (tên service), không qua cổng của host.
      GOPET_DB_HOST: mariadb
      GOPET_DB_PORT: "3306"
      # Mặc định dùng root; production nên tạo user riêng rồi đặt 2 biến này trong .env.
      GOPET_DB_USER: ${GOPET_DB_USER:-root}
      GOPET_DB_PASSWORD: ${GOPET_DB_PASSWORD:-${MARIADB_ROOT_PASSWORD}}
      # Dockerfile đã ENV TZ=Asia/Ho_Chi_Minh (ảnh hưởng DateTime.Now — giờ bảo trì, sự
      # kiện...); đặt lại ở đây cho hiển thị rõ + khớp mariadb/webadmin, không đổi hành vi.
      TZ: Asia/Ho_Chi_Minh

    ports:
      # CHỈ cổng game. HTTP 8082 là API quản trị (shutdown, mở SQL...) — không publish.
      # GOPET_GAME_PORT đổi cổng phía host (vd. thử container khi Gopet.exe native
      # đang giữ 19180).
      - "${GOPET_GAME_PORT:-19180}:19180"

    volumes:
      # Cấu hình cho container: gameBindAddress 0.0.0.0, tắt packet log.
      - ./gserver/server.json:/app/config/server.json:ro
      - gopet-gserver-log:/app/log
      - gopet-gserver-backup:/app/backup_sql

    # Không cấp stdin: server tự ngừng đọc lệnh console và vẫn chạy.
    stdin_open: false
    tty: false

    # `docker stop` gửi SIGTERM → App/GracefulShutdown.cs lưu market, clan, người
    # chơi rồi thoát. Mặc định Docker chỉ chờ 10s rồi SIGKILL — không đủ để lưu.
    stop_grace_period: 60s

    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/19180' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Nạp template item/pet/map lúc khởi động mất một lúc.
      start_period: 120s

  # Trang quản trị Next.js. Image build + push GHCR bằng GitHub Actions (job
  # build-push-webadmin, .github/workflows/gserver-ci-cd.yml) — máy chủ chỉ pull, không
  # build Node tại chỗ. Không publish cổng: chỉ service `caddy` gọi vào qua mạng compose.
  webadmin:
    profiles: ["server"]
    image: ghcr.io/${GHCR_OWNER:-unset}/gopet-webadmin:${WEBADMIN_TAG:-latest}
    container_name: gopet-webadmin
    restart: unless-stopped

    depends_on:
      mariadb:
        condition: service_healthy

    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_USER: ${WEBADMIN_DB_USER:-gopet_admin}
      DB_PASSWORD: ${WEBADMIN_DB_PASSWORD:-}
      DB_GAME: gopettae_tae2
      DB_WEB: gopettae_gopet_web
      DB_LOG: gp_log
      SESSION_SECRET: ${WEBADMIN_SESSION_SECRET:-}
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      # Chỉ Caddy đứng trước webadmin (không publish cổng ra host) nên tin XFF do Caddy đặt.
      TRUSTED_PROXY: "true"
      SUPERADMIN_USER_IDS: ${WEBADMIN_SUPERADMIN_USER_IDS:-1}

    # Không có "ports": chỉ caddy truy cập được qua mạng nội bộ compose (webadmin:3000).
    mem_limit: 384m

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Reverse proxy công khai duy nhất: HTTPS tự động (Let's Encrypt) + chặn IP ngoài
  # allowlist. Cấu hình: docker/caddy/Caddyfile.
  caddy:
    profiles: ["server"]
    image: caddy:2-alpine
    container_name: gopet-caddy
    restart: unless-stopped

    depends_on:
      webadmin:
        condition: service_healthy

    environment:
      TZ: Asia/Ho_Chi_Minh
      WEBADMIN_DOMAIN: ${WEBADMIN_DOMAIN:-localhost}
      WEBADMIN_ALLOWED_IPS: ${WEBADMIN_ALLOWED_IPS:-127.0.0.1/32}

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  gopet-db-data:
    name: gopet-db-data
  gopet-gserver-log:
    name: gopet-gserver-log
  gopet-gserver-backup:
    name: gopet-gserver-backup
  caddy_data:
    name: gopet-caddy-data
  caddy_config:
    name: gopet-caddy-config
